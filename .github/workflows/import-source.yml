name: Import project source

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand the verified local source snapshot
        run: |
          tar -xzf bilingual-manga-reader-source.tar.gz
          rm bilingual-manga-reader-source.tar.gz
          rm -f .github/workflows/import-source.yml
      - name: Publish the source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Bilingual Manga Reader 1.4.1 source"
          git push
